name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run offline security and validator tests
        run: python -S -m unittest discover -s tests -t . -p 'test_*.py' -v

      - name: Verify saved offline metrics and dashboard
        run: python -S day13_metrics.py --check
