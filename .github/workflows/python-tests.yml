name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Keep strict publication packages free of import-generated bytecode.
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run offline security and validator tests
        run: python -S -m unittest discover -s tests -t . -p 'test_*.py' -v

      - name: Verify saved offline metrics and dashboard
        run: python -S day13_metrics.py --check

      - name: Verify recovery replays
        run: |
          python -S day16_analysis.py --check
          python -S day17_analysis.py --check
          python -S day18_analysis.py --check
          python -S day19_analysis.py --check
          python -S day21_analysis.py --check
          python -S day22_analysis.py --check

      - name: Verify sanitized local result packages offline
        run: |
          python -S results/local-qwen-proposed-001/verify.py
          python -S results/day21-local-qwen-001/verify.py
          python -S results/day22-local-qwen-001/verify.py
          python -S day21_publication_check.py
